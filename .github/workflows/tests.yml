name: Tests

on:
  push:
    branches: [master, "dev-*"]
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  # A literal name: when called from release.yml, github.workflow is the caller's.
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (HA ${{ matrix.ha }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read  # checkout
    strategy:
      fail-fast: false
      matrix:
        include:
          # Newest HA; requirements_test.txt pins the matching
          # pytest-homeassistant release.
          - ha: latest
            requirements: requirements_test.txt
          # Oldest supported HA, declared in hacs.json (2026.3.1), with
          # pytest-homeassistant-custom-component (see tests/__init__.py).
          - ha: minimum
            requirements: requirements_test_min.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - run: python -m pip install -r "$REQS"
        env:
          REQS: ${{ matrix.requirements }}
      - run: python -m pytest --cov=custom_components.peloton --cov-report=term-missing
