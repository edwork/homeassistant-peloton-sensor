name: Release

# Publish a release in the GitHub web UI with a new tag such as 1.0.0 (or
# 1.1.0b1 for a pre-release). This workflow then validates and tests the
# tagged code, writes the tag's version into manifest.json, builds peloton.zip
# and attaches it to the release. HACS installs that zip (hacs.json:
# zip_release). Nothing is built locally.
#
# If the tag is malformed or any check fails, the release is turned back into
# a draft, which HACS ignores. Fix the cause and publish the draft again.
#
# Keep "Immutable releases" off in the repository settings: this workflow
# attaches peloton.zip after the release is published.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::Tag $TAG is not a version like 1.2.3 or 1.2.3b1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    needs: [tag]
    uses: $/.github/workflows/validate.yml
    permissions:
      contents: read

  tests:
    name: Tests
    needs: [tag]
    uses: $/.github/workflows/tests.yml
    permissions:
      contents: read

  package:
    name: Build and attach peloton.zip
    needs: [tag, validate, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # upload the release asset
      id-token: write  # sign the build provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Write the version into manifest.json
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          manifest=custom_components/peloton/manifest.json
          jq --arg version "$VERSION" '.version = $version' "$manifest" > manifest.tmp
          mv manifest.tmp "$manifest"
          echo "Packaging version $VERSION"
      - name: Build peloton.zip
        run: |
          cd custom_components/peloton
          zip -r -X "$GITHUB_WORKSPACE/peloton.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc'
          unzip -l "$GITHUB_WORKSPACE/peloton.zip"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: peloton.zip
      - name: Attach peloton.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" peloton.zip --clobber --repo "$GITHUB_REPOSITORY"

  unpublish:
    name: Return the release to draft
    needs: [tag, validate, tests, package]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write  # turn the release back into a draft
    steps:
      - name: Mark the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" --draft=true --repo "$GITHUB_REPOSITORY"
          echo "::error::Release $TAG was returned to draft because a check or the packaging failed. Fix the cause, then publish the draft again."
